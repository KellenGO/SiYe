name: Windows Executable Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-smoke:
    name: Build and validate Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Node for build only
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install backend development environment
        run: |
          uv lock --check
          uv sync

      - name: Run backend regression tests
        run: uv run pytest -q

      - name: Install frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Run frontend search tests
        working-directory: webui
        run: npm run test:search

      - name: Build production frontend
        working-directory: webui
        run: npm run build

      - name: Build executable distribution
        shell: pwsh
        run: |
          $pythonPath = Join-Path (Resolve-Path .venv) "Scripts/python.exe"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build_exe.ps1 -SkipTests -PythonPath $pythonPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract and smoke-test the executable in a clean room
        shell: pwsh
        run: |
          $cleanRoot = Join-Path $env:RUNNER_TEMP "mediacrawler-exe-clean-room"
          if (Test-Path $cleanRoot) { Remove-Item -LiteralPath $cleanRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $cleanRoot | Out-Null
          Expand-Archive -LiteralPath "dist/SiYe-Windows-x64.zip" -DestinationPath $cleanRoot
          $package = Join-Path $cleanRoot "SiYe"
          uv run python scripts/exe_clean_room_smoke.py --package $package

      - name: Silently install, smoke-test, and uninstall the installer
        shell: pwsh
        run: uv run python scripts/installer_clean_room_smoke.py --installer dist/SiYe-Setup-Windows-x64.exe

      - name: Upload validated executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiYe-Windows-x64
          path: |
            dist/SiYe-Setup-Windows-x64.exe
            dist/SiYe-Setup-Windows-x64.exe.sha256
            dist/SiYe-Windows-x64.zip
            dist/SiYe-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "dist/SiYe-Setup-Windows-x64.exe",
            "dist/SiYe-Setup-Windows-x64.exe.sha256",
            "dist/SiYe-Windows-x64.zip",
            "dist/SiYe-Windows-x64.zip.sha256",
            "--verify-tag",
            "--title", "四野 $env:GITHUB_REF_NAME",
            "--generate-notes"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
