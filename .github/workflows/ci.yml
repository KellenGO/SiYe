name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tests/test_sync_wire_contract.py 会拿真实的 sync_protocol.js 去喂生产校验函数；
      # 没装 Node 时这些用例会被 skip，CI 上显示成绿的，实际一条都没跑过。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Lock and install project dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Run local fixture and unit tests
        # Integration tests are marked and skipped by repository-wide defaults.
        run: uv run pytest -q

  redis-integration:
    name: Redis integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - name: Install project dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Run Redis-backed integration tests
        env:
          REDIS_DB_PWD: ""
        run: uv run pytest -q --run-integration -m integration tests/test_redis_cache.py

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run search tests
        run: npm run test:search
      - name: Build frontend
        run: npm run build
      - name: Run lint when configured
        shell: bash
        run: |
          if [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "eslint is not configured as a webui dependency; skipping lint."
          fi
