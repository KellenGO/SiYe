[project]
name = "mediacrawler"
authors = [{name = "relakkes", email = "relakkes@gmail.com"}]
version = "0.3.0"
description = "Cross-platform Chinese social content search for Xiaohongshu, Douyin, Bilibili, and Zhihu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.2",
    "httpx==0.28.1",
    "opencv-python>=4.11.0.86",
    "parsel==1.9.1",
    "pillow>=12.2.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pyexecjs==1.5.1",
    # 托盘启动器（无窗口启动 + 托盘菜单），仅 Windows 发行版需要
    "pystray>=0.19.5; sys_platform == 'win32'",
    "redis~=4.6.0",
    "tenacity==8.2.2",
    "uvicorn==0.29.0",
    "xhshow>=0.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pyinstaller>=6.11.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
# 有了它，测试文件里就不需要各自 sys.path.insert 项目根目录了。
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires an external service or live provider",
]
